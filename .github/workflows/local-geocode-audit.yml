name: Temporary local place lookup
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Audit named landmarks in OpenStreetMap
        run: |
          node --input-type=module <<'JS'
          const terms=['CRP Savar Bangladesh','Radio Colony Savar','Chapain Savar','Deoga Bazar Savar','Shia Masjid Mohammadpur','Shyamoli Square Dhaka','Savar New Market','Savar Colony'];
          for (const term of terms) {
            const url=new URL('https://photon.komoot.io/api/');
            url.searchParams.set('q',term);
            url.searchParams.set('limit','5');
            url.searchParams.set('bbox','90.15,23.72,90.45,23.96');
            url.searchParams.set('lat','23.855');
            url.searchParams.set('lon','90.26');
            try {
              const response=await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(9500)});
              const data=await response.json();
              console.log('PLACE '+JSON.stringify({term,status:response.status,results:(data.features||[]).slice(0,5).map(f=>({name:f.properties?.name,city:f.properties?.city,street:f.properties?.street,county:f.properties?.county,osm_key:f.properties?.osm_key,osm_value:f.properties?.osm_value,coordinates:f.geometry?.coordinates}))}));
            } catch(e) {console.log('PLACE '+JSON.stringify({term,error:String(e)}));}
          }
          JS
