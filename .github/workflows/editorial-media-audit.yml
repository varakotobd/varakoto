name: Temporary editorial media audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check image URLs embedded in published pages
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const paths=['beauty.html','travel-blog.html','index.html','articles/coxsbazar.html','articles/sreemangal.html','articles/ratargul.html'];
          const links=new Map();
          for(const path of paths){
            const html=await readFile(path,'utf8');
            for(const match of html.matchAll(/https:\/\/upload\.wikimedia\.org\/[^"'\s<)]+/g)){
              const link=match[0];
              if(!links.has(link))links.set(link,[]);
              links.get(link).push(path);
            }
          }
          for(const [url,files] of links){
            try{
              const response=await fetch(url,{method:'GET',signal:AbortSignal.timeout(12000),headers:{'user-agent':'VaraKotoWebsiteAudit/1.0 (website image availability checker)'}});
              console.log('IMAGE '+JSON.stringify({status:response.status,type:response.headers.get('content-type'),url,used:files}));
              await response.body?.cancel();
            }catch(e){console.log('IMAGE '+JSON.stringify({error:e.message,url,used:files}));}
          }
          JS
