name: Check logo availability
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing official logo URL
        run: |
          python - <<'PY'
          import urllib.request
          url='https://varakoto.wordpress.com/wp-content/uploads/2026/11/varakoto-bengali-rickshaw-logo.png'
          try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'VaraKotoLogoCheck/1.0'}),timeout=15) as response:
              b=response.read()
              print('Logo status:',response.status,'bytes:',len(b),'mime:',response.headers.get('Content-Type'),'png_end:',b[-8:].hex())
              assert response.status==200 and b[:8]==b'\x89PNG\r\n\x1a\n' and b[-8:]==b'IEND\xaeB\x60\x82'
          except Exception as e:
            print('Logo FAILED:',repr(e))
            raise
          PY
