name: One-time routing diagnostics
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public routing providers without secrets
        run: |
          node --input-type=module <<'JS'
          const urls=[
            ['OSRM', 'https://router.project-osrm.org/route/v1/driving/90.4125,23.8103;90.418,23.819?overview=false'],
            ['OSM routing', 'https://routing.openstreetmap.de/routed-car/route/v1/driving/90.4125,23.8103;90.418,23.819?overview=false'],
            ['Valhalla', 'https://valhalla1.openstreetmap.de/route?json=' + encodeURIComponent(JSON.stringify({locations:[{lat:23.8103,lon:90.4125},{lat:23.819,lon:90.418}],costing:'auto',units:'kilometers'}))]
          ];
          for(const [name,url] of urls){
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{accept:'application/json'}});
              const text=await r.text();
              console.log(name+': '+r.status+' '+text.slice(0,320));
            }catch(err){console.log(name+': request error: '+err.message)}
          }
          JS
