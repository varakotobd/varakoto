name: Mobile fare search browser test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Reproduce actual mobile search
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const assert = (v,m) => { if(!v) throw Error(m); };
          const browser = await chromium.launch({ headless: true, args:['--no-sandbox'] });
          const page = await browser.newPage({ viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1,locale:'bn-BD' });
          const pageErrors=[];
          page.on('pageerror',e=>{pageErrors.push(e.message);console.log('PAGE ERROR: '+e.message)});
          page.on('console',m=>{if(m.type()==='error') console.log('CONSOLE ERROR: '+m.text().slice(0,300))});
          try {
            let ready=false;
            for(let attempt=1;attempt<=12;attempt++){
              const response=await page.goto('https://varakoto.rickshaw.workers.dev/?e2e='+Date.now()+'&attempt='+attempt,{waitUntil:'domcontentloaded',timeout:30000});
              assert(response.status()===200,'Homepage HTTP '+response.status());
              const digest=await page.locator('link[href*="leaflet.css"]').getAttribute('integrity');
              if(digest==='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='){ ready=true; break; }
              console.log('Waiting for published map stylesheet update: '+digest);
              await page.waitForTimeout(3500);
            }
            assert(ready,'Cloudflare is still serving an old HTML map stylesheet version.');
            await page.waitForTimeout(1000);
            const mapCssLoaded=await page.evaluate(()=>[...document.styleSheets].some(s=>s.href?.includes('leaflet.css')));
            assert(mapCssLoaded,'Leaflet map stylesheet failed to load (CSP or SRI)');
            console.log('LEAFLET CSS CONFIRMED');
            await page.locator('#fromInput').fill('সাভার নিউ মার্কেট');
            await page.locator('#toInput').fill('চাপাইন');
            await page.locator('#findButton').click();
            await page.waitForTimeout(8000);
            const summary=await page.evaluate(()=>({
              rickshaw:document.getElementById('price-rickshaw')?.textContent,
              auto:document.getElementById('price-auto')?.textContent,
              fare:document.getElementById('fareStatus')?.textContent,
              distance:document.getElementById('distance')?.textContent,
              from:document.getElementById('fromInput')?.value,
              to:document.getElementById('toInput')?.value,
              hint:document.getElementById('journeyNote')?.textContent,
              overflow:document.documentElement.scrollWidth > window.innerWidth
            }));
            console.log('DIRECT FORM SEARCH '+JSON.stringify(summary));
            assert(summary.rickshaw?.includes('২০') || summary.rickshaw?.includes('20'),'Rickshaw fare not shown');
            assert(summary.auto?.includes('১০') || summary.auto?.includes('10'),'Auto fare not shown');
            console.log('DIRECT SEARCH PASSED');
            await page.locator('#fromInput').fill('সাভার নিউ');
            await page.waitForTimeout(1800);
            const matches=await page.locator('#fromList button').allTextContents();
            console.log('PICKUP SUGGESTIONS '+JSON.stringify(matches.slice(0,6)));
            assert(matches.some(t=>t.includes('সাভার নিউ মার্কেট')),'Expected local pickup suggestion missing');
            await page.locator('#fromList button').filter({hasText:'সাভার নিউ মার্কেট'}).first().click();
            await page.locator('#toInput').fill('চাপা');
            await page.waitForTimeout(1800);
            const toMatches=await page.locator('#toList button').allTextContents();
            console.log('DROP SUGGESTIONS '+JSON.stringify(toMatches.slice(0,6)));
            assert(toMatches.some(t=>t.includes('চাপাইন')),'Expected local drop suggestion missing');
            await page.locator('#toList button').filter({hasText:'চাপাইন'}).first().click();
            await page.waitForTimeout(7500);
            const second=await page.evaluate(()=>({
              rickshaw:document.getElementById('price-rickshaw')?.textContent,
              auto:document.getElementById('price-auto')?.textContent,
              distance:document.getElementById('distance')?.textContent,
              note:document.getElementById('journeyNote')?.textContent,
              bodyWidth:document.body.scrollWidth,
              viewportWidth:window.innerWidth
            }));
            console.log('SUGGESTION SEARCH '+JSON.stringify(second));
            assert(second.rickshaw?.includes('২০') || second.rickshaw?.includes('20'),'Suggested pickup/drop rickshaw fare not shown');
            assert(second.auto?.includes('১০') || second.auto?.includes('10'),'Suggested pickup/drop auto fare not shown');
            assert(!second.distance?.includes('—'),'Distance missing after selecting both mapped places');
            assert(second.bodyWidth<=second.viewportWidth + 2,'Mobile layout overflows viewport');

            // Verify the real on-screen fare submission form without adding fabricated
            // travel reports to the production D1 database.
            const reportHealth=await page.request.get('https://varakoto.rickshaw.workers.dev/api/health');
            const healthData=await reportHealth.json();
            console.log('REPORT HEALTH '+JSON.stringify(healthData));
            assert(healthData.submissions_ready===true, 'Fare submissions are disabled by missing server configuration.');
            const sentReports=[];
            await page.route('**/api/reports',async route=>{
              const payload=JSON.parse(route.request().postData());
              sentReports.push(payload);
              await route.fulfill({status:201,contentType:'application/json',body:JSON.stringify({ok:true,message:'ধন্যবাদ! আপনার ভাড়ার তথ্য যাচাইয়ের জন্য জমা হয়েছে।'})});
            });
            await page.locator('#rFrom').fill('সাভার নিউ মার্কেট');
            await page.locator('#rTo').fill('চাপাইন');
            await page.locator('#rMode').selectOption('rickshaw');
            await page.locator('#rFare').fill('20');
            await page.locator('#rConsent').check();
            await page.locator('#reportSubmit').click();
            await page.waitForFunction(()=>document.querySelector('#reportStatus')?.textContent.includes('জমা হয়েছে'),{timeout:10000});
            assert(sentReports.length===1 && sentReports[0].fare===20, 'Rickshaw report form did not send the correct fare');
            assert(sentReports[0].fare_basis==='per_ride' && sentReports[0].consent===true, 'Incorrect report terms or consent');
            console.log('RICKSHAW FORM SUCCESS '+JSON.stringify(sentReports[0]));
            await page.locator('#rFrom').fill('সাভার নিউ মার্কেট');
            await page.locator('#rTo').fill('চাপাইন');
            await page.locator('#rMode').selectOption('auto');
            await page.locator('#rVariant').selectOption('battery_auto');
            await page.locator('#rFare').fill('10');
            await page.locator('#rConsent').check();
            await page.locator('#reportSubmit').click();
            await page.waitForFunction(()=>document.querySelector('#reportStatus')?.textContent.includes('জমা হয়েছে'),{timeout:10000});
            assert(sentReports.length===2 && sentReports[1].fare===10, 'Auto report form did not send the correct fare');
            assert(sentReports[1].fare_basis==='per_person' && sentReports[1].vehicle_variant==='battery_auto', 'Auto person-based fare was incorrectly submitted');
            console.log('AUTO FORM SUCCESS '+JSON.stringify(sentReports[1]));
            console.log('MOBILE E2E + FARE SUBMISSION UI PASSED; page errors: '+JSON.stringify(pageErrors));

          } finally {
            await browser.close();
          }
          JS
