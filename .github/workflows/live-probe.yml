name: Live Vara Koto check
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed site, database, and map providers
        run: |
          node --input-type=module <<'JS'
          const base = 'https://varakoto.rickshaw.workers.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function get(path) {
            return await fetch(base + path, { signal: AbortSignal.timeout(10000), headers: { accept: 'application/json' } });
          }
          let ready = false;
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const response = await get('/');
              const html = await response.text();
              if (response.ok && html.includes('পিকআপ লোকেশন') && html.includes('ব্যাটারি অটো')) {
                console.log('Production homepage has the yellow pickup/drop-off interface.');
                ready = true;
                break;
              }
            } catch (error) {
              console.log('Homepage probe attempt ' + attempt + ': ' + error.message);
            }
            if (attempt !== 10) await sleep(7000);
          }
          if (!ready) throw new Error('New trip-search frontend is not accessible at the public Worker URL.');
          const logoResponse = await get('/brand/logo.png');
          const logoBytes = Buffer.from(await logoResponse.arrayBuffer());
          if (!logoResponse.ok ||
              !logoResponse.headers.get('content-type')?.includes('image/png') ||
              logoBytes.subarray(0,8).toString('hex') !== '89504e470d0a1a0a' ||
              logoBytes.length < 2500) {
            throw new Error('Official branded image failed to load from the public Worker.');
          }
          console.log('Official logo image loads directly from the Vara Koto website.');
          const release = '?release=' + process.env.GITHUB_SHA;
          for (const path of ['/', '/beauty', '/travel-blog', '/about',
            '/travel-blog/coxsbazar', '/travel-blog/sreemangal',
            '/travel-blog/ratargul', '/travel-blog/savar-local', '/travel-blog/local-fares']) {
            let found = false;
            for (let attempt = 1; attempt <= 6; attempt++) {
              const page = await (await get(path + release)).text();
              const headerStart = page.indexOf('<header');
              const headerEnd = page.indexOf('</header>', headerStart);
              const header = headerStart >= 0 && headerEnd >= 0 ? page.slice(headerStart,headerEnd+9) : '';
              if (header.includes('src="https://varakoto.wordpress.com/wp-content/uploads/2026/11/varakoto-transparent-official-logo.png"')) {
                if (path === '/' && (!page.includes('class="hero-art"') || !page.includes('📍 বাংলাদেশের পথে পথে'))) {
                  throw new Error('Homepage rickshaw cover image is missing.');
                }
                found = true;
                break;
              }
              if (attempt !== 6) await sleep(3500);
            }
            if (!found) throw new Error('Transparent logo is not yet deployed in public page: ' + path);
          }
          console.log('Official logo confirmed on all nine public pages.');
          for (const [path, heading] of [
            ['/beauty', 'সৌন্দর্যের'],
            ['/travel-blog', 'ভ্রমণ ব্লগ'],
            ['/about', 'আমাদের সম্পর্কে'],
            ['/travel-blog/coxsbazar', 'কক্সবাজার'],
            ['/travel-blog/sreemangal', 'শ্রীমঙ্গল'],
            ['/travel-blog/ratargul', 'রাতারগুল'],
            ['/travel-blog/savar-local', 'সাভার'],
            ['/travel-blog/local-fares', 'রিকশা']
          ]) {
            const response = await get(path);
            const html = await response.text();
            if (!response.ok || !html.includes(heading)) {
              throw new Error(path + ' page failed public reachability: HTTP ' + response.status);
            }
            console.log('Editorial page live: ' + path);
          }
          const home = await (await get('/')).text();
          if (home.indexOf('id="journeyLabel"') < 0 || home.indexOf('id="map"') <= home.indexOf('id="journeyLabel"')) {
            throw new Error('The trip information is not above the map.');
          }
          if (home.includes('animation:route-flow') || home.includes('map.flyToBounds')) {
            throw new Error('Old route movement is still enabled.');
          }
          console.log('Main results are above the static map.');
          const crpResponse = await get('/api/places?q=crp');
          const crpData = await crpResponse.json();
          if(!crpResponse.ok || !Array.isArray(crpData.locations) ||
              !crpData.locations.some(x => x.label.includes('সিআরপি') && Number.isFinite(x.lat))) {
            throw new Error('CRP landmark search is not returning a verified map point.');
          }
          console.log('Savar CRP local search returns a verified coordinate.');
          const chapainResponse = await get('/api/places?q=%E0%A6%9A%E0%A6%BE');
          const chapainJSON = await chapainResponse.json();
          const chapain = chapainJSON.locations?.find(x => x.name.includes('চাপাইন'));
          if (!chapainResponse.ok || !chapain || chapain.approximate !== true ||
              !Number.isFinite(chapain.lat) || !Number.isFinite(chapain.lon) ||
              chapain.requires_map_pin !== false) {
            throw new Error('Chapain pin is still unavailable for calculating distance: ' + JSON.stringify(chapainJSON));
          }
          console.log('Chapain local geocoder has the explicitly approximate map pin:', chapain.lat, chapain.lon);
          const health = await get('/api/health');
          const status = await health.json();
          if (!health.ok || status.ok !== true || status.submissions_ready !== true) throw new Error('D1 and fare submission are not ready: ' + JSON.stringify(status));
          console.log('D1 database health check passed.');
          const mapHTML = await (await get('/?country-map=' + Date.now())).text();
          if (!mapHTML.includes('id="mapInfo">📍 বাংলাদেশের মানচিত্র')) throw new Error('National map label is absent from homepage.');
          console.log('Bangladesh-wide map label is visible.');

          // Non-mutating validation probe: an invalid submission must return HTTP 400
          // without creating a fare report.
          const submitCheck = await fetch(base+'/api/reports',{
            method:'POST',
            headers:{'content-type':'application/json','origin':base},
            body:JSON.stringify({origin:'সাভার',destination:'সাভার',fare:0,consent:false})
          });
          const submitBody = await submitCheck.json();
          console.log('SUBMISSION VALIDATION PROBE:', submitCheck.status, JSON.stringify(submitBody));
          if(submitCheck.status!==400) throw new Error('Fare submission flow unavailable before data validation: '+JSON.stringify(submitBody));

          const estimates = await get('/api/estimates?origin=Savar&destination=Nabinagar');
          const data = await estimates.json();
          if (!estimates.ok || !Array.isArray(data.vehicles) || data.vehicles.length !== 2) {
            throw new Error('Vehicle-aware estimate endpoint failed: ' + JSON.stringify(data));
          }
          console.log('Only rickshaw and auto/leguna are offered. Local fares have explicit sources.');
          const guideResponse = await get('/api/estimates?origin='+encodeURIComponent('সাভার নিউ মার্কেট')+'&destination='+encodeURIComponent('চাপাইন'));
          const guide = await guideResponse.json();
          if (!guideResponse.ok || guide.sample_route !== 'newmarket_chapain' ||
              guide.vehicles.find(x => x.id === 'rickshaw')?.reference?.fare !== 20 ||
              guide.vehicles.find(x => x.id === 'auto')?.reference?.fare !== 10 ||
              guide.vehicles.find(x => x.id === 'auto')?.reference?.basis !== 'per_person') {
            throw new Error('Owner-supplied Savar New Market → Chapain fares not available: ' + JSON.stringify(guide));
          }
          console.log('Owner-supplied Savar sample fares live: Rickshaw Tk20; auto Tk10/person.');

          const ownerGuides = [
            {from:'সাভার নিউ মার্কেট',to:'চাপাইন',fares:[['rickshaw',20,'per_ride'],['auto',10,'per_person']]},
            {from:'সাভার নিউ মার্কেট',to:'দেওগা বাজার',fares:[['rickshaw',40,'per_ride'],['auto',20,'per_person']]},
            {from:'চাপাইন',to:'সিআরপি',fares:[['rickshaw',20,'per_ride']]},
            {from:'চাপাইন',to:'রেডিও কলোনি',fares:[['rickshaw',30,'per_ride']]},
            {from:'শ্যামলী স্কয়ার',to:'শিয়া মসজিদ',fares:[['rickshaw',30,'per_ride'],['auto',10,'per_person']]}
          ];
          for(const guide of ownerGuides) {
            const qs = new URLSearchParams({origin:guide.from,destination:guide.to});
            const response = await get('/api/estimates?' + qs.toString());
            const body = await response.json();
            if(!response.ok || !body.sample_route) {
              throw Error('No public reference match for '+guide.from+' → '+guide.to+': '+JSON.stringify(body));
            }
            for(const [mode,fare,basis] of guide.fares){
              const info=body.vehicles?.find(x=>x.id===mode)?.reference;
              if(info?.fare!==fare || info.basis!==basis)
                throw Error('Wrong reference for '+guide.from+' → '+guide.to+': '+JSON.stringify(info));
            }
            console.log('FARE LIVE '+guide.from+' → '+guide.to+': '+guide.fares.map(x=>x.join(':')).join(', '));
          }
          const alias = await get('/api/estimates?origin='+encodeURIComponent('Savar New Markt')+'&destination=Chapain');
          const aliases = await alias.json();
          if(!alias.ok || aliases.sample_route!=='newmarket_chapain')
            throw Error('Common English search spellings not mapped to the saved fare reference.');
          console.log('Alternate New Markt / Chapain spelling works.');

          for (const [name, path] of [
            ['Photon autocomplete', '/api/places?q=Dhaka'],
            ['OSRM road distance', '/api/route?origin_lat=23.8103&origin_lon=90.4125&destination_lat=23.819&destination_lon=90.418']
          ]) {
            try {
              const response = await get(path);
              const body = await response.json();
              console.log(name + ': HTTP ' + response.status + '; ' + (response.ok ? 'available' : 'temporarily unavailable'));
              if (response.ok && name === 'OSRM road distance' && !Number.isFinite(body.distance_km)) {
                console.log('WARNING: Road routing did not return a valid distance.');
              }
            } catch (error) {
              console.log('WARNING: ' + name + ' could not be verified: ' + error.message);
            }
          }
          JS
